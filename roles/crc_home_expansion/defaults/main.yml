---
# Use "auto" to discover one safe whole-disk candidate. Auto-discovery excludes
# the disk backing /, mounted/partitioned disks, disks with signatures, and PVs
# in another VG. It also recognizes a whole-disk PV already in the /home VG so
# reruns remain idempotent. Set an explicit /dev path to resolve ambiguity.
crc_home_expansion_disk: auto
crc_home_expansion_min_disk_size_gib: 32

# CRC stores its writable VM disk below /home by default:
# /home/<crc_run_user>/.crc/machines/crc/crc.qcow2
# Expand /home, not /, unless crc_run_home has been moved elsewhere.
crc_home_expansion_mount: /home

# Refuse disks that already contain signatures/partitions unless they are already
# an LVM PV in the target VG. Keep false: this playbook is meant for newly added
# empty disks.
crc_home_expansion_allow_nonempty_disk: false
